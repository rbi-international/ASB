# Contrastive prompt pairs for difference-in-means emotion vector extraction.
# Each pair: an emotion sentence and a neutral counterpart of matched length
# and topic. Hand-authored, licence-clean, fully controlled. 20 per category.
# Rule: the neutral keeps the triggering object or event and removes only the
# felt reaction and any emotion-naming word. Disgust is physical only.
meta:
  pairs_per_category_target: 20
  authorship: hand_written
