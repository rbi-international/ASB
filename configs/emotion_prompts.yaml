# Contrastive prompt pairs for difference-in-means emotion vector extraction.
# Each pair: an emotion-expressing sentence and a neutral counterpart of
# matched length and topic. Hand-authored, licence-clean, fully controlled.
# Target: 20 pairs per category. Seeded here with 3 examples as the format;
# Rohit fills the rest.
meta:
  pairs_per_category_target: 20
  authorship: hand_written
categories:
  joy:
    - emotion: "I could not stop smiling as the good news sank in."
      neutral: "I noted the news and returned to my desk to work."
    - emotion: "The whole kitchen was laughing while we cooked together."
      neutral: "The whole kitchen was quiet while we cooked together."
    - emotion: "Walking home tonight, every street felt bright and alive."
      neutral: "Walking home tonight, every street looked much as usual."

  sadness:
    - emotion: "A heavy grief settled over me as the room emptied."
      neutral: "The room emptied and I gathered my papers to leave."
    - emotion: "I read her last letter again and my chest ached."
      neutral: "I read her last letter again and filed it away."
    - emotion: "The house feels hollow now that the summer has ended."
      neutral: "The house is emptier now that the summer has ended."

  anger:
    - emotion: "My jaw tightened when he broke the promise again."
      neutral: "I made a note when he changed the plan again."
    - emotion: "I slammed the report down, furious at the wasted year."
      neutral: "I set the report down and reviewed the past year."
    - emotion: "They lied to my face and I wanted to shout."
      neutral: "They gave me the update and I wrote it down."

  fear:
    - emotion: "My pulse hammered as the footsteps came down the hall."
      neutral: "I looked up as the footsteps came down the hall."
    - emotion: "I froze at the top of the stairs, afraid to move."
      neutral: "I paused at the top of the stairs to check the time."
    - emotion: "Every shadow in the car park looked like a threat."
      neutral: "Every space in the car park looked much the same."

  trust:
    - emotion: "I handed her the keys without a second thought."
      neutral: "I handed her the keys and listed what each one opened."
    - emotion: "Whatever he tells me about the accounts, I believe it."
      neutral: "Whatever he tells me about the accounts, I record it."
    - emotion: "I would put my savings in that team's hands tomorrow."
      neutral: "I would move my savings to that account tomorrow."

  disgust:
    - emotion: "The smell from the bin made my stomach turn."
      neutral: "The smell from the bin reached the back door."
    - emotion: "I pushed the plate away, revolted by the grey meat."
      neutral: "I pushed the plate of grey meat to the side of the table."
    - emotion: "The sour smell of the wet towel made me gag."
      neutral: "The sour smell of the wet towel drifted across the bathroom."
    - emotion: "I gagged at the maggots squirming inside the piece of fruit."
      neutral: "I lifted the piece of fruit with maggots inside it onto a plate."
    - emotion: "She wrinkled her nose at the sour smell of the rag."
      neutral: "She carried the sour-smelling rag to the sink by the window."
    - emotion: "I recoiled when I saw the filthy water in the cup."
      neutral: "I carried the cup of cloudy water over to the kitchen tap."
    - emotion: "The greasy film on the spoon made my stomach churn."
      neutral: "The greasy film on the spoon remained after the wash."
    - emotion: "I could not bear the stench coming from the drain."
      neutral: "The smell coming from the drain reached the kitchen window."
    - emotion: "He spat out the food, repulsed by its rotten taste."
      neutral: "He set the food beside his plate after tasting it."
    - emotion: "I shuddered at the sight of the mouldy bread."
      neutral: "I moved the mouldy bread from the counter to the bin."
    - emotion: "The pile of rotting scraps made me feel nauseated."
      neutral: "The pile of rotting scraps was beside the back gate."
    - emotion: "I pulled my hand away, revolted by the sticky mess."
      neutral: "I wiped the sticky mess off my hand with a cloth."
    - emotion: "Her description of the infected wound turned my stomach."
      neutral: "Her description of the infected wound filled half a page."
    - emotion: "I cringed at the clump of hair in the shower drain."
      neutral: "I lifted the clump of hair from the shower drain with a brush."
    - emotion: "He shuddered at the tissue covered in green mucus."
      neutral: "He dropped the tissue covered in green mucus into the bin."
    - emotion: "I felt disgusted by the insects crawling over the meal."
      neutral: "I moved the meal with insects crawling over it to the counter."
    - emotion: "I gagged when I touched the mushy potato at the bottom of the bag."
      neutral: "I lifted the mushy potato from the bottom of the bag with a spoon."
    - emotion: "I felt sick when I saw the layer of slime inside the water bottle."
      neutral: "I rinsed the layer of slime from inside the water bottle at the tap."
    - emotion: "I gagged at the smell of the egg leaking across the counter."
      neutral: "I wiped the egg leaking across the counter with a paper towel."
    - emotion: "I recoiled when I saw the worms wriggling inside the apple."
      neutral: "I put the apple with the worms inside it on a saucer."

  surprise:
    - emotion: "I gasped when the door opened and everyone was there."
      neutral: "I paused when the door opened and everyone was there."
    - emotion: "Out of nowhere, the quiet student won the whole prize."
      neutral: "The quiet student walked forward to collect the whole prize."
    - emotion: "I never saw that ending coming, not for a second."
      neutral: "I read that ending while sitting by the window after lunch."
    - emotion: "I stared in disbelief when my name was called."
      neutral: "I stood by the desk when my name was called."
    - emotion: "I never expected to find my teacher on that flight."
      neutral: "I found my teacher seated near the back of that flight."
    - emotion: "She blinked in astonishment when the tiny box opened."
      neutral: "She looked at the contents when the tiny box opened."
    - emotion: "I was taken aback when the bill arrived that evening."
      neutral: "I put the bill beside my plate when it arrived that evening."
    - emotion: "His sudden announcement left me speechless at the meeting."
      neutral: "I listened to his announcement during the afternoon meeting."
    - emotion: "I could hardly believe the painting was by my nephew."
      neutral: "I read the label saying the painting was by my nephew."
    - emotion: "I jumped when the balloon burst right beside me."
      neutral: "I turned when the balloon burst right beside me."
    - emotion: "She looked astonished to see snow outside in April."
      neutral: "She looked through the window at the snow outside in April."
    - emotion: "I had no idea the cupboard hid another doorway."
      neutral: "I walked through the doorway behind the cupboard that afternoon."
    - emotion: "My mouth fell open as the magician pulled a coin from my sleeve."
      neutral: "I watched as the magician pulled a coin from my sleeve."
    - emotion: "The unexpected reply made me stop and read it twice."
      neutral: "The detailed reply made me stop and read it twice."
    - emotion: "I was amazed to discover how old the tree really was."
      neutral: "I asked the gardener how old the tree really was."
    - emotion: "He stared, stunned that the quiet phone had begun speaking."
      neutral: "He listened to the voice coming from the previously quiet phone."
    - emotion: "I did a double take when I saw my face on the poster."
      neutral: "I stood beside the poster with my face printed on it."
    - emotion: "I was startled when she spoke from behind the curtain."
      neutral: "I looked toward her when she spoke from behind the curtain."
    - emotion: "Nobody had warned me, so the announcement caught me off guard."
      neutral: "I heard the announcement while sitting near the back of the room."
    - emotion: "I was astonished to learn they had met before."
      neutral: "I spoke to them about where they had met before."

  anticipation:
    - emotion: "I keep checking the clock; the results arrive tonight."
      neutral: "I looked at the clock before leaving; the results arrive tonight."
    - emotion: "One more week and we finally board that plane."
      neutral: "In one more week we are scheduled to board that plane."
    - emotion: "I can already picture how the opening night will feel."
      neutral: "I will be sitting near the stage on opening night."
    - emotion: "I could hardly wait to meet the baby tomorrow."
      neutral: "I arranged a visit to meet the baby tomorrow."
    - emotion: "I kept imagining the moment we would open the shop."
      neutral: "I stood in the doorway of the shop before it opened."
    - emotion: "She counted the days until her brother came home."
      neutral: "She made up the spare bed before her brother came home."
    - emotion: "I looked forward to hearing the band's first song."
      neutral: "I sat near the speakers before the band's first song."
    - emotion: "I kept wondering what the parcel would contain."
      neutral: "I put the unopened parcel on the table beside the sofa."
    - emotion: "He waited eagerly for the first episode to begin."
      neutral: "He sat on the sofa before the first episode began."
    - emotion: "I could not wait to try the recipe on Sunday."
      neutral: "I bought the ingredients to try the recipe on Sunday."
    - emotion: "I pictured our reunion while waiting at the airport."
      neutral: "I waited at the airport where we had arranged our reunion."
    - emotion: "She talked eagerly about the exhibition opening next month."
      neutral: "She described the exhibition opening next month over lunch."
    - emotion: "I kept looking toward the door for our guests."
      neutral: "I left the door open for our guests that afternoon."
    - emotion: "I was eager to see what the next chapter held."
      neutral: "I turned the page to where the next chapter began."
    - emotion: "I imagined the applause before stepping onto the stage."
      neutral: "I faced the audience before stepping onto the stage."
    - emotion: "We counted down the hours until our journey began."
      neutral: "We put our bags beside the door before our journey began."
    - emotion: "I looked forward to showing him the finished room."
      neutral: "I opened the door to show him the finished room."
    - emotion: "I kept refreshing the page, waiting for ticket sales to open."
      neutral: "I opened the ticket sales page while eating my lunch."
    - emotion: "She could hardly wait for the garden's first flowers."
      neutral: "She watered the garden before its first flowers appeared."
    - emotion: "I lay awake imagining tomorrow's first day at work."
      neutral: "I set an alarm for tomorrow's first day at work."
